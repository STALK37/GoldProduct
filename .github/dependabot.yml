version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      radix:
        patterns: ["@radix-ui/*"]
      dev-tooling:
        patterns: ["eslint*", "typescript*", "vite*", "vitest*", "@playwright/*", "@testing-library/*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
